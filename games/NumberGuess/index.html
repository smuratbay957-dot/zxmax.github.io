<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Son Topish O'yini</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', system-ui, sans-serif;
}
button, input, a, .modal-overlay {
  touch-action: manipulation;
}
body {
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(145deg, #0f0c29, #302b63, #24243e);
  color: #eee;
  padding: 20px;
  overflow-x: hidden;
}
.game-container {
  background: rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 28px;
  padding: 40px 36px;
  width: 100%;
  max-width: 480px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.7);
  transition: 0.3s;
}
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}
.coin-display {
  background: linear-gradient(135deg, #f7b731, #f39c12);
  color: #1a1a2e;
  font-weight: 700;
  padding: 8px 18px;
  border-radius: 40px;
  font-size: 1.05rem;
  box-shadow: 0 4px 15px rgba(243,156,18,0.35);
  display: flex;
  align-items: center;
  gap: 6px;
}
.coin-display span {
  font-size: 1.15rem;
}
h1 {
  font-size: 1.65rem;
  font-weight: 700;
  background: linear-gradient(90deg, #f7971e, #ffd200);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.range-indicator {
  text-align: center;
  font-size: 0.95rem;
  color: #aaa;
  margin-bottom: 8px;
}
.attempt-info {
  text-align: center;
  font-size: 0.9rem;
  color: #888;
  margin-bottom: 20px;
}
input[type="number"] {
  width: 100%;
  padding: 14px 18px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(0,0,0,0.35);
  color: #fff;
  font-size: clamp(14px, 4.5vw, 16px);
  outline: none;
  transition: 0.2s;
  margin-bottom: 12px;
}
input[type="number"]:focus {
  border-color: #f7b731;
  box-shadow: 0 0 0 3px rgba(247,183,49,0.2);
}
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button {
  -webkit-appearance: none;
}
.btn-group {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}
.btn {
  flex: 1;
  padding: 14px;
  border: none;
  border-radius: 14px;
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
  transition: 0.2s;
}
.btn:active {
  transform: scale(0.96);
}
.btn-primary {
  background: linear-gradient(135deg, #f7971e, #ffd200);
  color: #1a1a2e;
}
.btn-primary:hover {
  box-shadow: 0 4px 20px rgba(247,183,49,0.4);
}
.btn-primary:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  box-shadow: none;
}
.btn-secondary {
  background: rgba(255,255,255,0.08);
  color: #ccc;
  border: 1px solid rgba(255,255,255,0.1);
}
.btn-secondary:hover {
  background: rgba(255,255,255,0.15);
}
.btn-danger {
  background: linear-gradient(135deg, #e74c3c, #c0392b);
  color: #fff;
}
.btn-danger:hover {
  box-shadow: 0 4px 20px rgba(231,76,60,0.4);
}
.btn-gold {
  background: linear-gradient(135deg, #f7b731, #e67e22);
  color: #1a1a2e;
}
.btn-gold:hover {
  box-shadow: 0 4px 20px rgba(247,183,49,0.4);
}
.hint-box {
  background: rgba(0,0,0,0.3);
  border-radius: 14px;
  padding: 14px 18px;
  margin-bottom: 16px;
  text-align: center;
  font-size: 1.15rem;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  word-break: break-word;
}
.history-box {
  background: rgba(0,0,0,0.2);
  border-radius: 14px;
  padding: 14px 18px;
  max-height: min(120px, 30vh);
  overflow-y: auto;
  font-size: 0.9rem;
  color: #aaa;
}
.history-box::-webkit-scrollbar {
  width: 4px;
}
.history-box::-webkit-scrollbar-thumb {
  background: #555;
  border-radius: 10px;
}
.history-item {
  display: inline-block;
  margin: 2px 4px 2px 0;
  padding: 2px 10px;
  border-radius: 20px;
  background: rgba(255,255,255,0.06);
  font-weight: 600;
}
.history-item.high {
  color: #ff6b6b;
}
.history-item.low {
  color: #74b9ff;
}
.history-item.correct {
  color: #55efc4;
  background: rgba(85,239,196,0.15);
}
.earn-msg {
  text-align: center;
  margin-top: 12px;
  font-size: 0.95rem;
  color: #ffd200;
  font-weight: 600;
  min-height: 24px;
}
/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.65);
  backdrop-filter: blur(6px);
  z-index: 999;
  justify-content: center;
  align-items: center;
}
.modal-overlay.active {
  display: flex;
}
.modal-box {
  background: #1e1e38;
  border-radius: 24px;
  padding: 32px 28px;
  width: 90%;
  max-width: 380px;
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 20px 60px rgba(0,0,0,0.8);
}
.modal-box h2 {
  margin-bottom: 8px;
  font-size: 1.3rem;
}
.modal-box p {
  color: #aaa;
  font-size: 0.9rem;
  margin-bottom: 18px;
}
.modal-box .btn-group {
  margin-bottom: 0;
}
.modal-input-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
}
.modal-input-row label {
  font-size: 0.95rem;
  white-space: nowrap;
  color: #ccc;
}
.modal-input-row input {
  flex: 1;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(0,0,0,0.3);
  color: #fff;
  font-size: clamp(14px, 4.5vw, 16px);
  outline: none;
  text-align: center;
  min-height: 44px;
}
.modal-input-row input:focus {
  border-color: #f7b731;
}
.modal-balance {
  text-align: center;
  font-size: 1rem;
  color: #f7b731;
  margin-bottom: 16px;
}
@media (max-width: 480px) {
  .game-container { padding: 24px 18px; border-radius: 20px; }
  .modal-box { padding: 24px 18px; }
  h1 { font-size: 1.4rem; }
}
@media (max-width: 360px) {
  .game-container { padding: 16px 12px; border-radius: 16px; }
  .modal-box { padding: 18px 14px; }
  .btn-group { flex-direction: column; gap: 8px; }
  .btn { padding: 12px; }
  .coin-display { padding: 6px 12px; font-size: 0.9rem; }
  .coin-display span { font-size: 0.95rem; }
  h1 { font-size: 1.2rem; }
}
</style>
</head>
<body>

<div class="game-container" id="app">
  <div class="top-bar">
    <h1>🎯 Topish</h1>
    <div class="coin-display"><span>🪙</span> <span id="coinBalance">0</span></div>
  </div>

  <div class="range-indicator" id="rangeIndicator">1 – 100 oralig'ida son toping</div>
  <div class="attempt-info" id="attemptInfo">Urinishlar: 0</div>

  <div class="hint-box" id="hintBox">Raqamni kiriting va boshlang!</div>

  <input type="number" id="guessInput" placeholder="Sonni kiriting..." min="1" max="100">

  <div class="btn-group">
    <button class="btn btn-primary" id="submitBtn">✅ Tekshirish</button>
    <button class="btn btn-secondary" id="zxmaxBtn" title="zxmax ga o'tkazish">🔄 zxmax</button>
  </div>

  <div class="btn-group">
    <button class="btn btn-gold" id="newGameBtn" style="display:none">🔄 Yangi o'yin</button>
  </div>

  <div class="earn-msg" id="earnMsg"></div>

  <div class="history-box" id="historyBox">
    <span style="color:#555">Taxminlar tarixi</span>
  </div>
  <a href="../../zxmax/index.html" style="display:flex;align-items:center;justify-content:center;text-align:center;color:rgba(255,255,255,0.3);font-size:clamp(11px,3.5vw,13px);text-decoration:none;margin-top:16px;padding:15px 8px;border-radius:8px;background:rgba(0,0,0,0.15);min-height:44px">← zxmax ga qaytish</a>
</div>

<!-- zxmax modal -->
<div class="modal-overlay" id="zxmaxModal">
  <div class="modal-box">
    <h2>🔄 zxmax ga o'tkazish</h2>
    <p>Coinlarni zxmax hisobingizga o'tkazing.</p>
    <div class="modal-balance" id="modalBalance">Sizda: 0 coin</div>
    <div class="modal-input-row">
      <label>Miqdor:</label>
      <input type="number" id="transferAmount" min="0" value="0">
      <button type="button" id="transferAllBtn" style="padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.08);color:#f7b731;font-size:clamp(12px,3.8vw,14px);font-weight:600;cursor:pointer;white-space:nowrap;min-height:44px">Hammasi</button>
    </div>
    <div class="btn-group">
      <button class="btn btn-danger" id="confirmTransferBtn">✅ O'tkazish</button>
      <button class="btn btn-secondary" id="cancelTransferBtn">❌ Bekor</button>
    </div>
  </div>
</div>

<script>
(function() {
  // ---- state ----
  let secretNumber = Math.floor(Math.random() * 100) + 1;
  let attempts = 0;
  let gameOver = false;
  let guessHistory = [];

  // ---- DOM refs ----
  const coinEl = document.getElementById('coinBalance');
  const rangeEl = document.getElementById('rangeIndicator');
  const attemptEl = document.getElementById('attemptInfo');
  const hintEl = document.getElementById('hintBox');
  const guessInput = document.getElementById('guessInput');
  const submitBtn = document.getElementById('submitBtn');
  const newGameBtn = document.getElementById('newGameBtn');
  const earnMsgEl = document.getElementById('earnMsg');
  const historyEl = document.getElementById('historyBox');
  const zxmaxBtn = document.getElementById('zxmaxBtn');
  const modalOverlay = document.getElementById('zxmaxModal');
  const modalBalance = document.getElementById('modalBalance');
  const transferInput = document.getElementById('transferAmount');
  const confirmBtn = document.getElementById('confirmTransferBtn');
  const cancelBtn = document.getElementById('cancelTransferBtn');

  // ---- coin helpers ----
  function getCoins() {
    return parseInt(localStorage.getItem('numberguess_coins'), 10) || 0;
  }

  function setCoins(val) {
    localStorage.setItem('numberguess_coins', String(val));
  }

  function addCoins(amount) {
    const c = getCoins() + amount;
    setCoins(c);
    return c;
  }

  function updateCoinUI() {
    coinEl.textContent = getCoins();
  }

  // ---- zxmax helpers ----
  function getZxmaxActiveProfile() {
    try {
      const raw = localStorage.getItem('zxmax_active_profile_v1');
      if (raw) {
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === 'object' ? parsed : null;
      }
    } catch (_) {}
    return null;
  }

  function getZxmaxSaveKey(profile) {
    if (profile && profile.id) {
      return 'zxmax_save_v1__' + profile.id;
    }
    return 'zxmax_save_v1';
  }

  function getZxmaxState() {
    const profile = getZxmaxActiveProfile();
    const key = getZxmaxSaveKey(profile);
    try {
      const raw = localStorage.getItem(key);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object' && typeof parsed.coins === 'number') {
          return parsed;
        }
      }
    } catch (_) {}
    // default state
    return { coins: 0, totalEarned: 0, totalSpent: 0, purchases: {}, lastDaily: null, lastQuickEarn: 0, theme: 'default' };
  }

  function saveZxmaxState(state) {
    const profile = getZxmaxActiveProfile();
    const key = getZxmaxSaveKey(profile);
    localStorage.setItem(key, JSON.stringify(state));
  }

  function transferToZxmax(amount) {
    const coins = getCoins();
    if (amount <= 0 || amount > coins) return false;

    const zxState = getZxmaxState();
    zxState.coins += amount;
    zxState.totalEarned += amount;
    saveZxmaxState(zxState);

    setCoins(coins - amount);
    updateCoinUI();
    return true;
  }

  // ---- game logic ----
  function startNewGame() {
    secretNumber = Math.floor(Math.random() * 100) + 1;
    attempts = 0;
    gameOver = false;
    guessHistory = [];
    guessInput.value = '';
    guessInput.disabled = false;
    submitBtn.disabled = false;
    newGameBtn.style.display = 'none';
    hintEl.textContent = 'Raqamni kiriting va boshlang!';
    hintEl.style.color = '';
    earnMsgEl.textContent = '';
    updateUI();
  }

  function updateUI() {
    attemptEl.textContent = 'Urinishlar: ' + attempts;
    updateCoinUI();
    renderHistory();
  }

  function renderHistory() {
    if (guessHistory.length === 0) {
      historyEl.innerHTML = '<span style="color:#555">Taxminlar tarixi</span>';
      return;
    }
    historyEl.innerHTML = guessHistory.map(function(item) {
      var cls = 'history-item';
      if (item.hit === 'high') cls += ' high';
      else if (item.hit === 'low') cls += ' low';
      else cls += ' correct';
      return '<span class="' + cls + '">' + item.val + '</span>';
    }).join(' ');
  }

  function calculateEarn(att) {
    if (att <= 3) return 30;
    if (att <= 7) return 20;
    if (att <= 12) return 10;
    return 5;
  }

  function handleGuess() {
    if (gameOver) return;

    const raw = guessInput.value.trim();
    if (raw === '') {
      hintEl.textContent = '⚠️ Iltimos son kiriting!';
      hintEl.style.color = '#f7b731';
      return;
    }
    const guess = Number(raw);
    if (isNaN(guess) || !Number.isInteger(guess) || guess < 1 || guess > 100) {
      hintEl.textContent = '⚠️ 1 dan 100 gacha son kiriting!';
      hintEl.style.color = '#f7b731';
      guessInput.value = '';
      return;
    }

    if (guessHistory.some(function(g) { return g.val === guess; })) {
      hintEl.textContent = '⚠️ Bu sonni avval kiritgansiz!';
      hintEl.style.color = '#f7b731';
      guessInput.value = '';
      return;
    }

    attempts++;
    guessInput.value = '';

    if (guess === secretNumber) {
      // correct!
      gameOver = true;
      guessHistory.push({ val: guess, hit: 'correct' });
      hintEl.textContent = '🎉 Barakalla! ' + secretNumber + ' to' + (String.fromCharCode(288) === '' ? '' : 'g\'') +'ri!';
      hintEl.style.color = '#55efc4';
      guessInput.disabled = true;
      submitBtn.disabled = true;
      newGameBtn.style.display = 'block';

      const earn = calculateEarn(attempts);
      addCoins(earn);
      updateCoinUI();
      earnMsgEl.textContent = '🪙 +' + earn + ' coin! (' + attempts + ' urinish)';
      renderHistory();
      return;
    }

    if (guess < secretNumber) {
      guessHistory.push({ val: guess, hit: 'low' });
      hintEl.textContent = '🔺 Kattaroq! ' + guess + ' dan katta son o\'yla.';
      hintEl.style.color = '#74b9ff';
    } else {
      guessHistory.push({ val: guess, hit: 'high' });
      hintEl.textContent = '🔻 Kichikroq! ' + guess + ' dan kichik son o\'yla.';
      hintEl.style.color = '#ff6b6b';
    }

    updateUI();
  }

  // ---- zxmax modal ----
  function openModal() {
    const coins = getCoins();
    modalBalance.textContent = 'Sizda: ' + coins + ' coin';
    transferInput.value = coins > 0 ? Math.min(coins, 100) : 0;
    transferInput.max = coins;
    modalOverlay.classList.add('active');
    transferInput.focus();
  }

  function closeModal() {
    modalOverlay.classList.remove('active');
  }

  function handleTransfer() {
    const coins = getCoins();
    if (coins <= 0) {
      hintEl.textContent = '❌ Hisobingizda coin yo\'q!';
      hintEl.style.color = '#ff6b6b';
      closeModal();
      return;
    }

    const amount = parseInt(transferInput.value, 10);
    if (isNaN(amount) || amount <= 0) {
      hintEl.textContent = '⚠️ Miqdorni to\'g\'ri kiriting!';
      hintEl.style.color = '#f7b731';
      closeModal();
      return;
    }
    if (amount > coins) {
      hintEl.textContent = '⚠️ Hisobingizda yetarli coin yo\'q!';
      hintEl.style.color = '#ff6b6b';
      closeModal();
      return;
    }

    const ok = transferToZxmax(amount);
    if (ok) {
      hintEl.textContent = '✅ ' + amount + ' coin zxmax ga o\'tkazildi!';
      hintEl.style.color = '#55efc4';
      earnMsgEl.textContent = '';
    } else {
      hintEl.textContent = '❌ Xatolik yuz berdi!';
      hintEl.style.color = '#ff6b6b';
    }
    closeModal();
  }

  // ---- event bindings ----
  submitBtn.addEventListener('click', handleGuess);
  guessInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') handleGuess();
  });
  newGameBtn.addEventListener('click', startNewGame);
  zxmaxBtn.addEventListener('click', openModal);
  confirmBtn.addEventListener('click', handleTransfer);
  document.getElementById('transferAllBtn').addEventListener('click', function(){
    transferInput.value = getCoins();
  });
  cancelBtn.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', function(e) {
    if (e.target === modalOverlay) closeModal();
  });

  // ---- init ----
  updateCoinUI();
  startNewGame();
})();
</script>
</body>
</html>
